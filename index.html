<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#04120a">
  <meta name="description" content="Asset release terminal.">
  <title>ASSET RELEASE TERMINAL</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2304120a'/><text x='8' y='12' font-size='11' text-anchor='middle' fill='%237dfaa8'>A</text></svg>">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="crt">
    <header class="hdr">
      <h1 class="title">ASSET RELEASE TERMINAL</h1>
      <p class="sysline" id="sysline">NODE: RELEASE-01 // STATUS: LOCKED</p>
      <div class="rail" id="rail" role="group" aria-label="Recovered code digits"></div>
      <p class="railnote" id="railnote" role="status" aria-live="polite" hidden></p>
    </header>

    <main class="view" id="view">
      <section class="panel">
        <p class="panel-body blink">POWERING ON ...</p>
      </section>
    </main>

    <footer class="ftr">
      <a class="btn mercy" id="mercy" href="#">MERCY</a>
      <button class="btn mute" id="mute" type="button" aria-pressed="false" aria-label="Toggle sound">SOUND ON</button>
      <button class="btn admin" id="adminbtn" type="button">ADMIN</button>
      <span class="ftr-note" id="ftrnote">NO OVERRIDE ON THIS TERMINAL.</span>
    </footer>
  </div>

  <script src="puzzles.js"></script>
  <script src="mastermind.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
